<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free 4K Image Upscaler</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #0f172a; color: #fff; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; }
    input[type="file"] { margin: 20px 0; }
    button { background: #38bdf8; color: #000; font-weight: bold; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }
    canvas { display: none; }
    img { max-width: 100%; margin-top: 20px; border-radius: 8px; }
    a.download-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #22c55e; color: #fff; text-decoration: none; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>4K Image Upscaler</h2>
    <p>আপনার ছবি আপলোড করে বিনামূল্যে 4K রেজোলিউশনে রেজাইজ করুন</p>
    <input type="file" id="upload" accept="image/*"><br>
    <button onclick="upscaleImage()">Upscale to 4K</button>
    <canvas id="canvas"></canvas>
    <div id="output"></div>
  </div>

  <script>
    function upscaleImage() {
      const fileInput = document.getElementById('upload');
      if (!fileInput.files[0]) return alert('দয়া করে একটি ছবি সিলেক্ট করুন!');

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('canvas');
          const ctx = canvas.getContext('2d');

          // Target 4K standard width (3840px)
          const targetWidth = 3840;
          const scaleFactor = targetWidth / img.width;
          const targetHeight = img.height * scaleFactor;

          canvas.width = targetWidth;
          canvas.height = targetHeight;

          // Smooth scaling
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

          const upscaledUrl = canvas.toDataURL('image/jpeg', 0.95);
          const output = document.getElementById('output');
          output.innerHTML = `
            <h3>Upscaled Result:</h3>
            <img src="${upscaledUrl}" alt="Upscaled Image"><br>
            <a href="${upscaledUrl}" download="4k-image.jpg" class="download-btn">Download 4K Image</a>
          `;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(fileInput.files[0]);
    }
  </script>
</body>
</html>
